<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!--
    Kelvin snowflake icon — monochrome white (#F5F5F5)
    Use on dark backgrounds (Kelvin Dark, terminal, boot splash).
  -->
  <defs>
    <g id="k-arm-w">
      <line x1="16" y1="16" x2="16" y2="2.5"
            stroke-width="1.6" stroke-linecap="round"/>
      <line x1="16" y1="10.9" x2="12.8" y2="9.3"
            stroke-width="1.2" stroke-linecap="round"/>
      <line x1="16" y1="10.9" x2="19.2" y2="9.3"
            stroke-width="1.2" stroke-linecap="round"/>
      <line x1="16" y1="7.0"  x2="12.8" y2="5.4"
            stroke-width="1.2" stroke-linecap="round"/>
      <line x1="16" y1="7.0"  x2="19.2" y2="5.4"
            stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </defs>

  <g stroke="#F5F5F5">
    <use href="#k-arm-w" transform="rotate(0   16 16)"/>
    <use href="#k-arm-w" transform="rotate(60  16 16)"/>
    <use href="#k-arm-w" transform="rotate(120 16 16)"/>
    <use href="#k-arm-w" transform="rotate(180 16 16)"/>
    <use href="#k-arm-w" transform="rotate(240 16 16)"/>
    <use href="#k-arm-w" transform="rotate(300 16 16)"/>
  </g>

  <circle cx="16" cy="16" r="2.2" fill="#F5F5F5"/>
</svg>
