<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!--
    Kelvin snowflake icon — full color (Kelvin Blue #A8D8EA)
    Use on dark backgrounds or where blue reads well.
    For light backgrounds, use kelvin-dark.svg.
    For dark backgrounds, use kelvin-white.svg.
    Works at 16px / 48px / 256px — scale the viewBox, not the file.
  -->
  <defs>
    <!--
      One arm of the snowflake, pointing straight up from center (16,16).
      Arm length: 13.5px (tip at y=2.5)
      Branch 1: 38% from center (y=10.9), branches at 60° from arm, length 3.2
      Branch 2: 65% from center (y=7.2), branches at 60° from arm, length 3.2
    -->
    <g id="k-arm">
      <line x1="16" y1="16" x2="16" y2="2.5"
            stroke-width="1.6" stroke-linecap="round"/>
      <!-- Inner branch pair -->
      <line x1="16" y1="10.9" x2="12.8" y2="9.3"
            stroke-width="1.2" stroke-linecap="round"/>
      <line x1="16" y1="10.9" x2="19.2" y2="9.3"
            stroke-width="1.2" stroke-linecap="round"/>
      <!-- Outer branch pair -->
      <line x1="16" y1="7.0"  x2="12.8" y2="5.4"
            stroke-width="1.2" stroke-linecap="round"/>
      <line x1="16" y1="7.0"  x2="19.2" y2="5.4"
            stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Six arms at 60° intervals -->
  <g stroke="#A8D8EA">
    <use href="#k-arm" transform="rotate(0   16 16)"/>
    <use href="#k-arm" transform="rotate(60  16 16)"/>
    <use href="#k-arm" transform="rotate(120 16 16)"/>
    <use href="#k-arm" transform="rotate(180 16 16)"/>
    <use href="#k-arm" transform="rotate(240 16 16)"/>
    <use href="#k-arm" transform="rotate(300 16 16)"/>
  </g>

  <!-- Center circle -->
  <circle cx="16" cy="16" r="2.2" fill="#A8D8EA"/>
</svg>
